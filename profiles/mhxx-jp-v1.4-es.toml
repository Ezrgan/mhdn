# MHXX JP v1.4 + Spanish patch (title version 4224).
# Addresses are quoted because TOML has no hexadecimal integer syntax.
# Monster-list numbers come from the GPLv3 reference overlay and still need a
# live session before they are treated as confirmed. See docs/RE_NOTES.md.

[meta]
game = "MHXX"
region = "JP"
version = "1.4-es"
title_id = "0x0004000000197100"
update_title_version = 4224
fingerprint = [
  { addr = "0x00100000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00140000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00180000", len = 4096, xxh3 = "0x0" },
  { addr = "0x001C0000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00200000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00240000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00280000", len = 4096, xxh3 = "0x0" },
  { addr = "0x002C0000", len = 4096, xxh3 = "0x0" },
]

[monster_list]
base_candidates = [
  { addr = "0x00D2CAA0", expect = ["0x082B7720", "0x082B9660"] },
  { addr = "0x00D30AA0", expect = ["0x082B98B0"] },
  { addr = "0x00D3A8E0", expect = ["0x082CE730", "0x082D0760"] },
]
slots = 16
slot_stride = 4
slot_offset = "0x14"
chain = ["0x10A8", "0x360"]

[monster]
hp = { off = 0, ty = "u32" }
max_hp = { off = 4, ty = "u32" }
species = { off = "0x5A18", ty = "u16" }
size = { off = -432, ty = "f32" }
pos = { off = -800, ty = "vec3" }
poison = { off = "0x54E4", ty = "u16" }
visible_flag = { off = -5128, ty = "u8", hidden_value = "0x7" }

[frame_counter]
# Direct u32. With the 60fps cheat: about +60/s in a quest, frozen on the in-game pause.
# Same address after a title reboot. See docs/RE_NOTES.md.
addr = "0x082C4BB8"
chain = "TBD"

[scene]
# in_quest is 7 while hunting and 0 in the village, on the load screen, and on the reward screen.
# loading is a u8: 1 on the load screen and on the reward screen, 0 in the village and while hunting.
# Those two screens are not separated yet. Read the loading flag as a byte.
chain = "TBD"
in_quest = { addr = "0x08142FE0", ty = "u32", value = 7 }
loading = { addr = "0x00DC5814", ty = "u8", value = 1 }

[hunter]
# deref(base) + pos.off = feet. Confirmed on 3 boots (docs/RE_NOTES.md).
base = "0x0814E620"
pos = { off = 64, ty = "vec3" }

[camera]
mode = "params"
# The live value at fov_y is degrees (50), proven by the projection scale 1/tan(25°).
fov_unit = "deg"
# deref(base) + off. Eye +0x40, target +0x60, fov_y +0x3C. Same 3 boots.
base = "0x0814CACC"
eye = { off = 64, ty = "vec3" }
target = { off = 96, ty = "vec3" }
fov_y = { off = 60, ty = "f32" }

[species]
default_anchor_height = 150.0

# Live GO 2026-09-28: one boss, 774 → 0, 111 hits summed 775 (1 overkill on the killing blow).
[damage_tap]
hook_addr = "0x008D03E8"
return_addr = "0x008D03EC"
expected_words = [
  { addr = "0x008D03E8", word = "0xE593C0A8" },
  { addr = "0x008D03EC", word = "0xE59C0360" },
  { addr = "0x008D03FC", word = "0xE58C0360" },
]
cave = { addr = "0x00BF2D00", len = "0x300" }
ring = { addr = "0x00D32000", capacity = 64, entry_size = 40 }
