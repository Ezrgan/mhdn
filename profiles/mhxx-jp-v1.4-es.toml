# MHXX JP v1.4 + Spanish patch (title version 4224).
# Addresses are quoted because TOML has no hexadecimal integer syntax.
# Monster-list numbers come from the GPLv3 reference overlay and still need a
# live session before they are treated as confirmed. See docs/RE_NOTES.md.

[meta]
game = "MHXX"
region = "JP"
version = "1.4-es"
title_id = "0x0004000000197100"
update_title_version = 4224
fingerprint = [
  { addr = "0x00100000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00140000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00180000", len = 4096, xxh3 = "0x0" },
  { addr = "0x001C0000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00200000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00240000", len = 4096, xxh3 = "0x0" },
  { addr = "0x00280000", len = 4096, xxh3 = "0x0" },
  { addr = "0x002C0000", len = 4096, xxh3 = "0x0" },
]

